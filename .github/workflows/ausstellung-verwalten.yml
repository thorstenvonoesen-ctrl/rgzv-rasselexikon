name: Ausstellung verwalten
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: Aktion
        required: true
        type: choice
        options:
          - Ausstellung anlegen/Grunddaten ändern
          - Mehrere Rassen hinzufügen/ersetzen
          - Rasse hinzufügen
          - Rasse/Käfige ändern
          - Rasse entfernen
          - Ausstellung deaktivieren
          - Erkundung freigeben
          - Erkundung sperren
      veranstaltungId:
        description: Eindeutige Veranstaltungs-ID (leer = ausgewählte Veranstaltung; neue ID startet mit leerer Belegung)
        type: string
      beginn:
        description: Beginn im Format JJJJ-MM-TT
        type: string
      ende:
        description: Letzter Veranstaltungstag im Format JJJJ-MM-TT
        type: string
      oeffnungszeiten:
        description: Öffnungszeiten (leer = unverändert, - = entfernen)
        type: string
      beschreibung:
        description: Beschreibung (leer = unverändert, - = entfernen)
        type: string
      status:
        description: Status (nur bei Grunddaten ändern)
        type: choice
        options:
          - angekuendigt
          - aktuell
          - beendet
          - abgesagt
      titel:
        description: Titel der Veranstaltung (leer = unverändert)
        type: string
      ort:
        description: Ort (leer = unverändert)
        type: string
      datum:
        description: Optionale Datumsanzeige (leer = automatisch aus Beginn/Ende)
        type: string
      begruessung:
        description: Alternativer Beschreibungstext (nur wenn Beschreibung leer)
        type: string
      rasse:
        description: Rasse (für Hinzufügen, Ändern oder Entfernen)
        type: string
      masseneingabe:
        description: 'Rassen und Käfige – Masseneingabe (ersetzt ALLE Rassen): Ayam Cemani 32-38; Marans 58'
        type: string
      kaefigVon:
        description: Käfig von (für Hinzufügen oder Ändern)
        type: string
      kaefigBis:
        description: Käfig bis (leer = einzelner Käfig)
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: ausstellung-verwalten
  cancel-in-progress: false
jobs:
  speichern:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eingaben prüfen und Ausstellung speichern
        run: node scripts/ausstellung-verwalten.cjs
      - name: Ausstellungsdaten committen
        env:
          ACTION: ${{ inputs.aktion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/veranstaltungen.json assets/ausstellungen/
          if ! git diff --cached --quiet; then
            if [ "$ACTION" = 'Ausstellung deaktivieren' ]; then
              git commit -m 'Ausstellung deaktiviert'
            else
              git commit -m 'Ausstellung aktualisiert'
            fi
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      # GITHUB_TOKEN-Commits starten keinen automatischen Pages-Build.
      # Deshalb den vorhandenen Branch-Pages-Build ausdrücklich anfordern.
      - name: Bestehende GitHub-Pages-Seite veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_url=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.url')
          for attempt in $(seq 1 60); do
            status=$(gh api "$build_url" --jq '.status')
            if [ "$status" = 'built' ]; then exit 0; fi
            if [ "$status" = 'errored' ]; then
              echo 'GitHub Pages konnte nicht veröffentlicht werden. Bitte den Pages-Build prüfen.'
              exit 1
            fi
            sleep 10
          done
          echo 'Pages-Build noch nicht abgeschlossen. Bitte den Status auf GitHub prüfen.'
          exit 1
