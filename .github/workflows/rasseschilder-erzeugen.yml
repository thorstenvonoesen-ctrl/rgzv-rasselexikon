name: A7-Rasseschilder aktualisieren
on:
  push:
    paths:
      - assets/finder-data.js
      - scripts/build_a7.py
      - scripts/build.py
      - scripts/check_pdf_storage.py
      - .github/workflows/rasseschilder-erzeugen.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: a7-rasseschilder
  cancel-in-progress: false
jobs:
  erstellen:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.4.9 qrcode==8.2 pillow==12.3.0 pypdf
      - run: python scripts/build_a7.py
      - run: python scripts/check_pdf_storage.py
      - name: Aktualisierte Druckdateien speichern
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output/pdf scripts/a7-layout.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'A7-Rasseschilder automatisch aktualisiert'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Wie beim bestehenden Verwaltungsworkflow: Branch-Pages-Build anfordern.
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/pages/builds"
